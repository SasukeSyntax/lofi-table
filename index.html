<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Table</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Dongle&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css">
</head>

<body class="midnight-theme">

    <header class="top-bar">

        <div class="logo" id="logo">
            📕Lofi Table
        </div>

        <div class="theme-switcher-div">
            <button class="theme-btn">Midnight</button>
            <button class="theme-btn">Cyberpunk</button>
            <button class="theme-btn">Autumn</button>
        </div>
    </header>

    <main class="grid-container">

        <div class="big-card" id="volume-panel">
            <h2>Sounds</h2>

            <div class="volume-row">
                <span class="sound">Raining</span>
                <input type="range" id="vol-rain" min="0" max="1" step="0.1" value="0">
                <button class="play-pause" onclick="playSound('rain')">Play</button>
            </div>

            <div class="volume-row">
                <span class="sound">Crackeling Fire</span>
                <input type="range" id="vol-fire" min="0" max="1" step="0.1" value="0">
                <button class="play-pause" onclick="playSound('fire')">Play</button>
            </div>

            <div class="volume-row">
                <span class="sound">Keyboard</span>
                <input type="range" id="vol-keyboard" min="0" max="1" step="0.1" value="0">
                <button class="play-pause" onclick="playSound('keyboard')">Play</button>
            </div>

            <div class="volume-row">
                <span class="sound">Lofi Beats</span>
                <input type="range" id="vol-lofi" min="0" max="1" step="0.1" value="0">
                <button class="play-pause" onclick="playSound('lofi')">Play</button>
            </div>
        </div>

        <div class="big-card main-panel" id="timer-panel">

            <div class="card timer-card">
                <h2 class="timer-headLine">Focus Timer</h2>
                <div id="countdown">25:00</div>
                <div class="controls">
                    <button id="timer-start" onclick="startTimer()">Stop</button>
                    <button id="timer-pause" onclick="pauseTimer()">Pause</button>
                    <button id="timer-reset" onclick="resetTimer()">Reset</button>
                </div>
            </div>

            <div class="card todo-card" id="note-taker">
             <h2>Tasklist</h2>

              <div class="todo-input-row">
                <input id="task-input" type="text" placeholder="Task description...">
                <button onclick="addTask()">ADD</button>
              </div>

             <ul id="todo-list">
                <!-- takz will load heya -->
             </ul>
            </div>

        </div>

        <div class="big-card notes-card">
            <h2>Notes</h2>
            <textarea id="sticky" oninput="saveNotes()" placeholder="Jot down notes, links, or doodles here..."></textarea>
        </div>
    </main>

    <audio id="audio-rain" src="ASSets/rain.mp3" loop></audio>
    <audio id="audio-fire" src="ASSets/fire.mp3" loop></audio>
    <audio id="audio-keyboard" src="ASSets/keyboard.mp3" loop></audio>
    <audio id="audio-lofi" src="ASSets/lofi-beats.mp3" loop></audio>


    <script src="script.js"></script>
</body>
</html>
